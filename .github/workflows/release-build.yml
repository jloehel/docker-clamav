name: Release Build

on:
  release:
    types: [published]

env:
  APP_NAME: clamav
  APP_USERNAME: clamav

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release tag
        id: release
        run: |
          # Tag format: <os_flavor>/<os_version>/<app_version>/<unofficial_sigs_version>/<build>
          # Example: alpine/3.23/1.4.3/7.2.5/1
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: ./docker_build.sh
        env:
          CI_BUILD: "true"
          IMAGE_VERSION: ${{ steps.release.outputs.tag }}
          IMAGE_DESCRIPTION: "ClamAV ${{ steps.release.outputs.tag }}"

      - name: Push to registries
        run: ./docker_push.sh
        env:
          CI_BUILD: "true"
          IMAGE_VERSION: ${{ steps.release.outputs.tag }}
          REGISTRIES: "ghcr.io/jloehel docker.io/jloehel"
          PUSH_LATEST: "true"
