# ClamAV Daemon Configuration for Ubuntu/Debian

# General
TemporaryDirectory /var/tmp
DatabaseDirectory /clamav/data/official
PidFile /var/run/clamav/clamd.pid
Foreground yes
User clamav
ExitOnOOM yes

# Networking
TCPSocket 3310
TCPAddr 0.0.0.0

# Logging
LogFileUnlock no
LogTime yes
LogVerbose no

# Scanning & Results
ExtendedDetectionInfo yes
DetectPUA no
AlgorithmicDetection yes
Bytecode yes
BytecodeTimeout 60000
BytecodeSecurity TrustSigned

# File type scanning
ScanPE yes
DisableCertCheck yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanMail yes
ScanHTML yes
ScanArchive yes
ScanXMLDOCS yes
ScanHWP3 yes

# Phishing
PhishingSignatures yes
PhishingScanURLs yes

# Limits
MaxScanSize 150M
MaxFileSize 30M
MaxRecursion 16
MaxFiles 15000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 128
MaxIconsPE 200
PCREMatchLimit 10000
PCRERecMatchLimit 10000

# Alerting
AlertBrokenExecutables no
AlertBrokenMedia no
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no
AlertOLE2Macros no
AlertPartitionIntersection no
