# FreshClam Configuration for Alpine

# General
DatabaseDirectory /clamav/data
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
NotifyClamd /etc/clamav/clamd.conf
Bytecode yes

# Logging
LogTime yes
LogVerbose no
LogRotate yes

# Updates
ScriptedUpdates yes
CompressLocalDatabase no

# Timeouts
ConnectTimeout 30
ReceiveTimeout 60

# Checks per day (will be overridden by daemon mode)
Checks 24
